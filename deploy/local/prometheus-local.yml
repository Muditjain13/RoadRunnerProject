global:
  scrape_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Local (non-Docker) equivalent of deploy/compose/prometheus.yml: every
  # service runs as a native Windows process on localhost, one port per
  # service (see each cmd/<service>/main.go's *_METRICS_ADDR default).
  - job_name: gateway
    static_configs:
      - targets: ["localhost:9100"]
  - job_name: catalog
    static_configs:
      - targets: ["localhost:9101"]
  - job_name: inventory
    static_configs:
      - targets: ["localhost:9102"]
  - job_name: payment
    static_configs:
      - targets: ["localhost:9103"]
  - job_name: supplier-sim
    static_configs:
      - targets: ["localhost:9104"]
  - job_name: booking
    static_configs:
      - targets: ["localhost:9105"]
  - job_name: search
    static_configs:
      - targets: ["localhost:9106"]
  - job_name: notification
    static_configs:
      - targets: ["localhost:9107"]
