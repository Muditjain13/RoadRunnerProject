# Search's result cache - no persistence needed, an emptyDir is fine
# (losing it just means the next search on that route/date is a cache
# miss, not a correctness problem - see internal/search/service.go).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: transport-app
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: transport-app
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
