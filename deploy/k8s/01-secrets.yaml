# Placeholder credentials for a from-scratch cluster demo. A real
# deployment would populate this Secret via a sealed-secrets/external-
# secrets controller, never commit real values here - these exist so
# `kubectl apply -f deploy/k8s/` works standalone without a separate
# secret-management step, matching how docker-compose.yml also hardcodes
# root/root for local dev.
apiVersion: v1
kind: Secret
metadata:
  name: transport-app-db
  namespace: transport-app
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "root"
  INVENTORY_MYSQL_DSN: "root:root@tcp(mysql:3306)/inventory?parseTime=true"
  PAYMENT_MYSQL_DSN: "root:root@tcp(mysql:3306)/payment?parseTime=true"
  BOOKING_MYSQL_DSN: "root:root@tcp(mysql:3306)/booking?parseTime=true"
