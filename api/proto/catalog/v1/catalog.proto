syntax = "proto3";

package catalog.v1;

option go_package = "github.com/Muditjain13/transport-app/api/proto/catalog/v1;catalogv1";

import "google/protobuf/timestamp.proto";

service CatalogService {
  // SearchTrips returns scheduled trips for a route, date, and mode. An
  // empty result is a valid response (e.g. no bus on a long route, no
  // rail to SXR), not an error.
  rpc SearchTrips(SearchTripsRequest) returns (SearchTripsResponse);

  // GetTrip returns a single trip by ID, used by booking to re-fetch fare
  // and class details when creating a hold.
  rpc GetTrip(GetTripRequest) returns (GetTripResponse);
}

enum Mode {
  MODE_UNSPECIFIED = 0;
  MODE_BUS = 1;
  MODE_TRAIN = 2;
  MODE_FLIGHT = 3;
}

message TripClass {
  string code = 1;         // e.g. "seater", "sleeper", "ac_sleeper"
  int64 fare_paise = 2;
  int32 capacity = 3;
}

message Trip {
  string id = 1;
  string route_id = 2;
  string operator_id = 3;
  Mode mode = 4;
  string vehicle_number = 5;
  google.protobuf.Timestamp departure_at = 6;
  google.protobuf.Timestamp arrival_at = 7;
  repeated TripClass classes = 8;
  string operator_name = 9;
}

message SearchTripsRequest {
  string origin_code = 1;
  string dest_code = 2;
  google.protobuf.Timestamp date = 3; // departure calendar day
  Mode mode = 4;
}

message SearchTripsResponse {
  repeated Trip trips = 1;
}

message GetTripRequest {
  string trip_id = 1;
}

message GetTripResponse {
  Trip trip = 1;
}
