name: CI

on:
  # Docs-only changes skip CI. No job reads a Markdown file or anything under
  # docs/ (checked: the scripts, tests, Dockerfile and go:embed use none of them),
  # and a push that also touches any other file still runs everything.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build, vet, race tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -tags=integration ./...

  compose-smoke:
    name: docker compose smoke test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose -f deploy/compose/docker-compose.yml up -d --build
      - name: Search and book through the gateway
        run: bash scripts/smoke.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/e2e/package-lock.json
      - name: Install UI test dependencies
        working-directory: test/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Book through the real UI in headless Chromium
        working-directory: test/e2e
        run: node ui.mjs
      - name: Load script still runs (10 second k6 scenario)
        if: matrix.arch == 'amd64'
        run: >
          docker run --rm --network host -e DURATION=10s
          -v "$PWD/test/load:/scripts:ro" grafana/k6:0.54.0 run /scripts/booking.js
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down -v

  demo-profile:
    name: public demo profile (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      DEMO_DOMAIN: localhost
      COMPOSE_ARGS: -f deploy/compose/docker-compose.yml -f deploy/oracle/docker-compose.demo.yml
    steps:
      - uses: actions/checkout@v4
      - name: Start the demo profile
        run: docker compose $COMPOSE_ARGS up -d --build
      - name: Smoke test through the loopback-bound gateway
        run: GATEWAY=http://127.0.0.1:8080 bash scripts/smoke.sh
      - name: Check exposed ports, HTTPS and write rate limit
        run: bash scripts/check-demo-profile.sh
      - name: Nightly reset keeps Caddy's certificate volumes
        run: bash scripts/check-demo-reset.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose $COMPOSE_ARGS logs --no-color
      - name: Tear down
        if: always()
        run: docker compose $COMPOSE_ARGS down -v
