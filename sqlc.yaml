version: "2"
sql:
  - engine: "mysql"
    queries: "internal/inventory/repo/queries"
    schema: "migrations/inventory"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/inventory/repo/sqlcgen"
        emit_json_tags: true
        emit_interface: true
        emit_exact_table_names: false
  - engine: "mysql"
    queries: "internal/payment/repo/queries"
    schema: "migrations/payment"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/payment/repo/sqlcgen"
        emit_json_tags: true
        emit_interface: true
        emit_exact_table_names: false
  - engine: "mysql"
    queries: "internal/booking/repo/queries"
    schema: "migrations/booking"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/booking/repo/sqlcgen"
        emit_json_tags: true
        emit_interface: true
        emit_exact_table_names: false
